<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <section class="pricing">
  <div class="pricing__list">

    <article class="price-card">
      <h2 class="price-card__title">Starter</h2>
      <p class="price-card__price">€9<span>/міс.</span></p>

      <ul class="price-card__features">
        <li>✓ 5 проєктів</li>
        <li>✓ 10 ГБ сховища</li>
        <li>✓ Базова підтримка</li>
      </ul>

      <button class="price-card__button">
        Обрати тариф
      </button>
    </article>

    <article class="price-card price-card--pro">
      <span class="price-card__badge">Рекомендовано</span>

      <h2 class="price-card__title">Pro</h2>
      <p class="price-card__price">€19<span>/міс.</span></p>

      <ul class="price-card__features">
        <li>✓ 20 проєктів</li>
        <li>✓ 100 ГБ сховища</li>
        <li>✓ Пріоритетна підтримка</li>
      </ul>

      <button class="price-card__button">
        Обрати тариф
      </button>
    </article>

    <article class="price-card">
      <h2 class="price-card__title">Legendary</h2>
      <p class="price-card__price">€39<span>/міс.</span></p>

      <ul class="price-card__features">
        <li>✓ Необмежені проєкти</li>
        <li>✓ 1 ТБ сховища</li>
        <li>✓ VIP-підтримка</li>
      </ul>

      <button class="price-card__button">
        Обрати тариф
      </button>
    </article>

  </div>
</section>
</body>
</html>
